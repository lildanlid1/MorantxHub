name: Publish protected MorantxHub release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'tools/build.mjs'
      - 'tools/verify.mjs'
      - 'tools/vm_stage.py'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: morantx-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout protected release repository
        uses: actions/checkout@v4

      - name: Validate private source access
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Set SOURCE_REPO_TOKEN (fine-grained PAT with Contents:Read on MorantxHub-Scripts) in this repository's Actions secrets."
            exit 1
          fi

      - name: Checkout readable source
        uses: actions/checkout@v4
        with:
          repository: lildanlid1/MorantxHub-Scripts
          path: _source
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned Luau VM/AST obfuscator
        uses: actions/checkout@v4
        with:
          repository: vo3pal/obscura
          ref: 742770554151d82c6a12ae6e24a0e47471bc467c
          path: _obscura
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install obfuscator dependencies
        run: python -m pip install -r _obscura/requirements.txt

      - name: Checkout pinned Luau compiler
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: 9d7748a4f324213a18cb8283fa2a77c330225fa0
          path: _luau
          persist-credentials: false

      - name: Build Luau syntax compiler
        run: |
          cmake -S _luau -B _luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build _luau-build --target Luau.Compile.CLI --config Release --parallel 4
          test -x _luau-build/luau-compile
          echo "$PWD/_luau-build" >> "$GITHUB_PATH"

      - name: Transform Luau with compatibility-sensitive VM/AST layers
        run: python tools/vm_stage.py _source _stage _obscura

      - name: Encrypt and shuffle all staged Lua payloads
        run: node tools/build.mjs _stage .

      - name: Test Lua 5.2 decoder smoke payload
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.2
          lua5.2 -e 'loadstring=load; assert(dofile(".obfuscation-smoke.lua") == 15)'

      - name: Preserve bundled artwork
        run: cp -a _source/assets ./assets

      - name: Verify all encoded Lua bytes and assets
        run: node tools/verify.mjs _stage .

      - name: Require protection coverage report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("protection-report.json").read_text())
          modes = report["modeCounts"]
          assert report["totalLua"] == 193, f"Unexpected script inventory: {report['totalLua']}"
          assert sum(modes.values()) == 193, f"Coverage gap: {modes}"
          assert modes["vm"] + modes["native"] > 0, "No AST/VM protection applied"
          print("Protection coverage:", modes)
          PY

      - name: Publish validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md games.md games.json TESTING.md build-report.json protection-report.json loader.lua scripts library assets
          if ! git diff --cached --quiet; then
            git commit -m "Publish VM/AST and encrypted MorantxHub scripts"
            git push origin HEAD:main
          fi
